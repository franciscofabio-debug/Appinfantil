<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1"
    >

    <meta name="theme-color" content="#ff77b7">

    <title>Nosso Cantinho Mágico</title>

    <style>
        :root {
            --rosa: #ff77b7;
            --rosa-claro: #ffe2f0;
            --roxo: #8068df;
            --verde: #c9f5d6;
            --azul: #e4f8ff;
            --amarelo: #fff1a6;
            --texto: #5d4772;
            --vermelho: #dc5573;
            --branco: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--texto);
            background:
                radial-gradient(
                    circle at 15% 10%,
                    #fff5a8 0 5%,
                    transparent 6%
                ),
                radial-gradient(
                    circle at 85% 15%,
                    #ffcce5 0 6%,
                    transparent 7%
                ),
                linear-gradient(135deg, #c9f5ff, #ffe3f1);
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
            touch-action: manipulation;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .app {
            width: min(100%, 560px);
            min-height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 35px rgba(81, 50, 110, 0.25);
        }

        header {
            padding: 17px;
            color: white;
            text-align: center;
            background: linear-gradient(135deg, var(--rosa), #aa7cff);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 6px 0 0;
            font-size: 13px;
        }

        #status {
            min-height: 41px;
            padding: 11px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            background: var(--amarelo);
        }

        .tela {
            flex: 1;
            min-height: 0;
            padding: 22px;
        }

        .escondido {
            display: none !important;
        }

        .cartao {
            max-width: 440px;
            margin: 0 auto 16px;
            padding: 20px;
            text-align: center;
            background: white;
            border-radius: 25px;
            box-shadow: 0 6px 18px rgba(81, 50, 110, 0.15);
        }

        .cartao h2 {
            margin-top: 0;
        }

        .cartao p {
            line-height: 1.5;
        }

        .escolhas {
            display: grid;
            gap: 14px;
        }

        .escolha {
            padding: 18px;
            color: var(--texto);
            font-size: 18px;
            font-weight: bold;
            border: 0;
            border-radius: 20px;
        }

        .adulto {
            background: var(--verde);
        }

        .crianca {
            background: var(--rosa-claro);
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input {
            width: 100%;
            margin: 7px 0 12px;
            padding: 13px;
            color: var(--texto);
            background: white;
            border: 3px solid #e5d8fa;
            border-radius: 17px;
            outline: none;
        }

        input:focus {
            border-color: var(--roxo);
        }

        .principal,
        .secundario,
        .perigo {
            padding: 12px 16px;
            font-weight: bold;
            border: 0;
            border-radius: 17px;
        }

        .principal {
            color: white;
            background: var(--roxo);
        }

        .secundario {
            color: var(--texto);
            background: var(--amarelo);
        }

        .perigo {
            color: white;
            background: var(--vermelho);
        }

        .botoes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 9px;
            margin-top: 12px;
        }

        .codigo {
            margin: 14px 0;
            padding: 16px;
            color: var(--roxo);
            font-size: clamp(23px, 7vw, 35px);
            font-weight: bold;
            letter-spacing: 2px;
            overflow-wrap: anywhere;
            background: var(--amarelo);
            border: 3px dashed #d5b946;
            border-radius: 18px;
        }

        #chat {
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        .barra-chat {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 9px 11px;
            background: var(--rosa-claro);
        }

        .dados-chat {
            flex: 1;
            min-width: 0;
        }

        .dados-chat strong,
        .dados-chat small {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dados-chat small {
            margin-top: 3px;
        }

        .barra-chat button {
            flex: 0 0 auto;
            padding: 7px 9px;
            border: 0;
            border-radius: 11px;
        }

        #alternar-som {
            color: var(--texto);
            background: white;
        }

        #reconectar {
            color: var(--texto);
            background: var(--amarelo);
        }

        #sair {
            color: white;
            background: var(--vermelho);
        }

        #mensagens {
            flex: 1;
            min-height: 280px;
            padding: 13px;
            overflow-y: auto;
            overscroll-behavior: contain;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    white 0 2%,
                    transparent 3%
                ),
                radial-gradient(
                    circle at 80% 35%,
                    #fff3ad 0 2%,
                    transparent 3%
                ),
                var(--azul);
        }

        #mais-antigas {
            display: block;
            margin: 0 auto 13px;
            padding: 8px 13px;
            color: var(--texto);
            font-size: 13px;
            font-weight: bold;
            background: white;
            border: 2px solid #decdf5;
            border-radius: 14px;
        }

        .aviso {
            max-width: 390px;
            margin: 0 auto 18px;
            padding: 12px;
            line-height: 1.5;
            text-align: center;
            background: white;
            border-radius: 20px;
        }

        .mensagem {
            width: fit-content;
            max-width: 82%;
            margin: 9px 0;
            padding: 10px 14px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 3px 8px rgba(63, 46, 78, 0.13);
            animation: aparecer 0.2s ease;
        }

        .mensagem.minha {
            margin-left: auto;
            background: var(--verde);
            border-bottom-right-radius: 5px;
        }

        .mensagem.outra {
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }

        .mensagem strong {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .mensagem .texto {
            font-size: 18px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .mensagem time {
            display: block;
            margin-top: 5px;
            font-size: 10px;
            text-align: right;
            opacity: 0.65;
        }

        .emojis {
            display: flex;
            gap: 7px;
            padding: 8px;
            overflow-x: auto;
            background: white;
        }

        .emojis button {
            flex: 0 0 auto;
            padding: 8px 11px;
            font-size: 23px;
            background: var(--amarelo);
            border: 0;
            border-radius: 14px;
        }

        #formulario {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: white;
        }

        #formulario input {
            flex: 1;
            min-width: 0;
            margin: 0;
        }

        #botao-enviar {
            min-width: 57px;
            color: white;
            font-size: 24px;
            background: var(--roxo);
            border: 0;
            border-radius: 18px;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (min-width: 600px) {
            body {
                padding: 20px;
            }

            .app {
                min-height: calc(100vh - 40px);
                max-height: 880px;
                border-radius: 28px;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <header>
            <h1>🌈 Nosso Cantinho Mágico</h1>
            <p>Um espaço especial para duas pessoas ✨</p>
        </header>

        <div id="status">
            🟡 Escolha quem usará este celular
        </div>

        <section id="inicio" class="tela">
            <div class="cartao">
                <h2>Quem usará este celular?</h2>

                <div class="escolhas">
                    <button
                        id="escolher-adulto"
                        class="escolha adulto"
                        type="button"
                    >
                        🦁 Papai ou Mamãe
                    </button>

                    <button
                        id="escolher-crianca"
                        class="escolha crianca"
                        type="button"
                    >
                        🦄 Criança
                    </button>
                </div>
            </div>
        </section>

        <section id="config-adulto" class="tela escondido">
            <div class="cartao">
                <h2>🦁 Celular do adulto</h2>

                <label for="nome-adulto">
                    Seu nome
                </label>

                <input
                    id="nome-adulto"
                    maxlength="25"
                    value="Papai ou Mamãe"
                >

                <button
                    id="criar-sala"
                    class="principal"
                    type="button"
                >
                    Criar nosso cantinho
                </button>

                <div class="botoes">
                    <button
                        class="secundario voltar"
                        type="button"
                    >
                        Voltar
                    </button>
                </div>
            </div>
        </section>

        <section id="espera-adulto" class="tela escondido">
            <div class="cartao">
                <h2>⭐ Código da criança</h2>

                <p>
                    Digite este código no celular da criança:
                </p>

                <div id="codigo-exibido" class="codigo"></div>

                <p>
                    Mantenha esta página aberta enquanto aguarda.
                </p>

                <div class="botoes">
                    <button
                        id="copiar-codigo"
                        class="principal"
                        type="button"
                    >
                        Copiar código
                    </button>

                    <button
                        id="compartilhar-codigo"
                        class="secundario"
                        type="button"
                    >
                        Compartilhar
                    </button>

                    <button
                        id="novo-codigo"
                        class="secundario"
                        type="button"
                    >
                        Novo código
                    </button>

                    <button
                        class="perigo reiniciar"
                        type="button"
                    >
                        Cancelar
                    </button>
                </div>
            </div>
        </section>

        <section id="config-crianca" class="tela escondido">
            <div class="cartao">
                <h2>🦄 Celular da criança</h2>

                <label for="nome-crianca">
                    Nome da criança
                </label>

                <input
                    id="nome-crianca"
                    maxlength="25"
                    value="Minha estrelinha"
                >

                <label for="codigo-crianca">
                    Código mostrado no celular do adulto
                </label>

                <input
                    id="codigo-crianca"
                    maxlength="14"
                    placeholder="ABCD-EFGH-IJKL"
                    autocomplete="off"
                    autocapitalize="characters"
                >

                <button
                    id="entrar-sala"
                    class="principal"
                    type="button"
                >
                    Entrar no cantinho
                </button>

                <div class="botoes">
                    <button
                        class="secundario voltar"
                        type="button"
                    >
                        Voltar
                    </button>
                </div>
            </div>
        </section>

        <section id="chat" class="tela escondido">
            <div class="barra-chat">
                <div class="dados-chat">
                    <strong id="companheiro">
                        💞 Conectando…
                    </strong>

                    <small id="codigo-mini"></small>
                </div>

                <button
                    id="alternar-som"
                    type="button"
                    title="Ativar ou desativar sons"
                    aria-label="Ativar ou desativar sons"
                >
                    🔊
                </button>

                <button
                    id="reconectar"
                    class="escondido"
                    type="button"
                >
                    Reconectar
                </button>

                <button id="sair" type="button">
                    Sair
                </button>
            </div>

            <div id="mensagens" aria-live="polite">
                <button
                    id="mais-antigas"
                    class="escondido"
                    type="button"
                >
                    ↑ Carregar mensagens antigas
                </button>

                <div id="lista-mensagens"></div>
            </div>

            <div id="emojis" class="emojis">
                <button type="button">❤️</button>
                <button type="button">🥰</button>
                <button type="button">🌈</button>
                <button type="button">🦄</button>
                <button type="button">⭐</button>
                <button type="button">😂</button>
                <button type="button">👏</button>
                <button type="button">🎉</button>
                <button type="button">😘</button>
            </div>

            <form id="formulario">
                <input
                    id="texto"
                    maxlength="250"
                    autocomplete="off"
                    placeholder="Escreva uma mensagem..."
                    aria-label="Mensagem"
                >

                <button
                    id="botao-enviar"
                    type="submit"
                    aria-label="Enviar"
                    disabled
                >
                    ➤
                </button>
            </form>
        </section>
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"
        onerror="
            this.onerror = null;
            this.src =
                'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js';
        "
    ></script>

    <script>
        "use strict";

        window.addEventListener("DOMContentLoaded", () => {
            const TELAS = [
                "inicio",
                "config-adulto",
                "espera-adulto",
                "config-crianca",
                "chat"
            ];

            /*
             * O histórico não tem limite definido pelo aplicativo.
             * Apenas 100 mensagens são exibidas por página para evitar
             * travamentos no navegador.
             */
            const TAMANHO_PAGINA = 100;
            const TAMANHO_PAGINA_REDE = 200;
            const TAMANHO_LOTE_REDE = 40;
            const MAXIMO_NA_TELA = 500;

            const NOME_BANCO = "cantinho-magico-banco-v2";
            const VERSAO_BANCO = 2;
            const NOME_TABELA = "mensagens";
            const NOME_INDICE = "sala_ordem";

            const CHAVE_CODIGO_ADULTO =
                "cantinho-codigo-adulto-v3";

            const CHAVE_ULTIMO_CODIGO =
                "cantinho-ultimo-codigo-v3";

            const CHAVE_NOME_ADULTO =
                "cantinho-nome-adulto-v3";

            const CHAVE_NOME_CRIANCA =
                "cantinho-nome-crianca-v3";

            const CHAVE_SOM =
                "cantinho-som-ativado-v3";

            const ALFABETO =
                "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

            const estado = {
                banco: null,
                peer: null,
                conexao: null,
                perfil: "",
                meuNome: "",
                nomeCompanheiro: "",
                codigoSala: "",
                conectado: false,
                primeiraOrdem: null,
                geracao: 0,
                sincronizando: false
            };

            const mensagensMemoria = new Map();
            const mensagensRenderizadas = new Set();
            const salasMigradas = new Set();

            let temporizadorAtualizacao = null;
            let contextoAudio = null;

            let somAtivado =
                localStorage.getItem(CHAVE_SOM) !== "false";

            const elemento = (id) => {
                return document.getElementById(id);
            };

            const status = elemento("status");
            const mensagensElemento = elemento("mensagens");
            const listaMensagens = elemento("lista-mensagens");
            const botaoMaisAntigas = elemento("mais-antigas");
            const campoTexto = elemento("texto");
            const botaoEnviar = elemento("botao-enviar");
            const companheiro = elemento("companheiro");
            const codigoMini = elemento("codigo-mini");
            const botaoSom = elemento("alternar-som");

            function mostrarTela(id) {
                TELAS.forEach((tela) => {
                    elemento(tela).classList.toggle(
                        "escondido",
                        tela !== id
                    );
                });
            }

            function atualizarStatus(
                texto,
                cor = "#fff1a6"
            ) {
                status.textContent = texto;
                status.style.background = cor;
            }

            function mostrarReconectar(mostrar) {
                elemento("reconectar").classList.toggle(
                    "escondido",
                    !mostrar
                );
            }

            function atualizarBotaoSom() {
                botaoSom.textContent =
                    somAtivado ? "🔊" : "🔇";

                botaoSom.title =
                    somAtivado
                        ? "Desativar sons"
                        : "Ativar sons";
            }

            function limparCodigo(codigo) {
                return String(codigo || "")
                    .toUpperCase()
                    .replace(/[^A-Z2-9]/g, "")
                    .slice(0, 12);
            }

            function formatarCodigo(codigo) {
                const limpo = limparCodigo(codigo);

                return limpo.match(/.{1,4}/g)?.join("-") || "";
            }

            function gerarCodigo() {
                const numeros = new Uint8Array(12);

                crypto.getRandomValues(numeros);

                return Array.from(
                    numeros,
                    (numero) => {
                        return ALFABETO[
                            numero % ALFABETO.length
                        ];
                    }
                ).join("");
            }

            function idDaSala(codigo) {
                return (
                    "cantinho-" +
                    limparCodigo(codigo).toLowerCase()
                );
            }

            function gerarIdMensagem() {
                if (
                    typeof crypto.randomUUID === "function"
                ) {
                    return crypto.randomUUID();
                }

                return (
                    Date.now() +
                    "-" +
                    Math.random().toString(16).slice(2)
                );
            }

            function criarOrdem(criadoEm, id) {
                const tempo = String(
                    Number(criadoEm) || Date.now()
                ).padStart(13, "0");

                return `${tempo}-${String(id)}`;
            }

            function esperar(milissegundos) {
                return new Promise((resolve) => {
                    setTimeout(resolve, milissegundos);
                });
            }

            /*
             * Sons
             */

            async function obterContextoAudio() {
                if (!somAtivado) {
                    return null;
                }

                const AudioContexto =
                    window.AudioContext ||
                    window.webkitAudioContext;

                if (!AudioContexto) {
                    return null;
                }

                if (!contextoAudio) {
                    contextoAudio = new AudioContexto();
                }

                if (contextoAudio.state === "suspended") {
                    try {
                        await contextoAudio.resume();
                    } catch (erro) {
                        console.warn(
                            "O navegador bloqueou o áudio.",
                            erro
                        );

                        return null;
                    }
                }

                return contextoAudio;
            }

            function tocarNota(
                contexto,
                frequencia,
                atraso,
                duracao,
                volume
            ) {
                const oscilador = contexto.createOscillator();
                const ganho = contexto.createGain();

                const inicio =
                    contexto.currentTime + atraso;

                const fim =
                    inicio + duracao;

                oscilador.type = "sine";

                oscilador.frequency.setValueAtTime(
                    frequencia,
                    inicio
                );

                ganho.gain.setValueAtTime(
                    0.0001,
                    inicio
                );

                ganho.gain.exponentialRampToValueAtTime(
                    volume,
                    inicio + 0.015
                );

                ganho.gain.exponentialRampToValueAtTime(
                    0.0001,
                    fim
                );

                oscilador.connect(ganho);
                ganho.connect(contexto.destination);

                oscilador.start(inicio);
                oscilador.stop(fim);
            }

            async function tocarSomEnvio() {
                const contexto =
                    await obterContextoAudio();

                if (!contexto) {
                    return;
                }

                tocarNota(
                    contexto,
                    760,
                    0,
                    0.09,
                    0.04
                );
            }

            async function tocarSomRecebimento() {
                const contexto =
                    await obterContextoAudio();

                if (!contexto) {
                    return;
                }

                tocarNota(
                    contexto,
                    620,
                    0,
                    0.10,
                    0.045
                );

                tocarNota(
                    contexto,
                    840,
                    0.11,
                    0.13,
                    0.045
                );
            }

            function prepararAudio() {
                if (somAtivado) {
                    void obterContextoAudio();
                }
            }

            /*
             * IndexedDB
             */

            function abrirBanco() {
                return new Promise((resolve, reject) => {
                    const requisicao = indexedDB.open(
                        NOME_BANCO,
                        VERSAO_BANCO
                    );

                    requisicao.onupgradeneeded = () => {
                        const bancoAtual =
                            requisicao.result;

                        let tabela;

                        if (
                            !bancoAtual.objectStoreNames.contains(
                                NOME_TABELA
                            )
                        ) {
                            tabela =
                                bancoAtual.createObjectStore(
                                    NOME_TABELA,
                                    {
                                        keyPath: "id"
                                    }
                                );
                        } else {
                            tabela =
                                requisicao.transaction.objectStore(
                                    NOME_TABELA
                                );
                        }

                        if (
                            !tabela.indexNames.contains(
                                NOME_INDICE
                            )
                        ) {
                            tabela.createIndex(
                                NOME_INDICE,
                                ["sala", "ordem"],
                                {
                                    unique: false
                                }
                            );
                        }

                        /*
                         * Atualiza mensagens salvas por versões antigas.
                         */
                        const cursorRequisicao =
                            tabela.openCursor();

                        cursorRequisicao.onsuccess = () => {
                            const cursor =
                                cursorRequisicao.result;

                            if (!cursor) {
                                return;
                            }

                            const mensagem =
                                cursor.value;

                            let alterada = false;

                            if (
                                !mensagem.sala &&
                                mensagem.room
                            ) {
                                mensagem.sala =
                                    mensagem.room;

                                alterada = true;
                            }

                            if (!mensagem.criadoEm) {
                                mensagem.criadoEm =
                                    Date.now();

                                alterada = true;
                            }

                            if (!mensagem.ordem) {
                                mensagem.ordem =
                                    criarOrdem(
                                        mensagem.criadoEm,
                                        mensagem.id
                                    );

                                alterada = true;
                            }

                            if (alterada) {
                                cursor.update(mensagem);
                            }

                            cursor.continue();
                        };
                    };

                    requisicao.onsuccess = () => {
                        const bancoAtual =
                            requisicao.result;

                        bancoAtual.onversionchange = () => {
                            bancoAtual.close();
                        };

                        resolve(bancoAtual);
                    };

                    requisicao.onerror = () => {
                        reject(
                            requisicao.error ||
                            new Error(
                                "Não foi possível abrir o banco."
                            )
                        );
                    };
                });
            }

            async function iniciarArmazenamento() {
                if (!("indexedDB" in window)) {
                    console.warn(
                        "IndexedDB não está disponível."
                    );

                    return;
                }

                try {
                    estado.banco = await abrirBanco();
                } catch (erro) {
                    estado.banco = null;

                    console.error(
                        "Erro ao abrir o IndexedDB.",
                        erro
                    );
                }

                try {
                    await navigator.storage?.persist?.();
                } catch (erro) {
                    console.warn(
                        "Persistência de armazenamento não concedida.",
                        erro
                    );
                }
            }

            async function garantirArmazenamento() {
                if (!estado.banco) {
                    await iniciarArmazenamento();
                }
            }

            async function salvarMensagens(itens) {
                const unicas = new Map();

                itens.forEach((mensagem) => {
                    if (!mensagem?.id) {
                        return;
                    }

                    unicas.set(
                        mensagem.id,
                        mensagem
                    );

                    mensagensMemoria.set(
                        mensagem.id,
                        mensagem
                    );
                });

                const mensagens =
                    Array.from(unicas.values());

                if (
                    mensagens.length === 0 ||
                    !estado.banco
                ) {
                    return;
                }

                try {
                    await new Promise(
                        (resolve, reject) => {
                            const transacao =
                                estado.banco.transaction(
                                    NOME_TABELA,
                                    "readwrite"
                                );

                            const tabela =
                                transacao.objectStore(
                                    NOME_TABELA
                                );

                            mensagens.forEach(
                                (mensagem) => {
                                    tabela.put(mensagem);
                                }
                            );

                            transacao.oncomplete = () => {
                                resolve();
                            };

                            transacao.onabort = () => {
                                reject(
                                    transacao.error ||
                                    new Error(
                                        "Gravação cancelada."
                                    )
                                );
                            };
                        }
                    );
                } catch (erro) {
                    console.error(
                        "Não foi possível salvar mensagens.",
                        erro
                    );

                    atualizarStatus(
                        "⚠️ A conversa continua, mas o navegador não conseguiu salvar o histórico.",
                        "#ffe0a8"
                    );
                }
            }

            function buscarNaMemoria(
                sala,
                limite,
                antesDe = null
            ) {
                return Array.from(
                    mensagensMemoria.values()
                )
                    .filter((mensagem) => {
                        return (
                            mensagem.sala === sala &&
                            (
                                antesDe === null ||
                                mensagem.ordem < antesDe
                            )
                        );
                    })
                    .sort((a, b) => {
                        return b.ordem.localeCompare(
                            a.ordem
                        );
                    })
                    .slice(0, limite)
                    .reverse();
            }

            async function buscarMensagens(
                sala,
                limite,
                antesDe = null
            ) {
                if (!estado.banco) {
                    return buscarNaMemoria(
                        sala,
                        limite,
                        antesDe
                    );
                }

                try {
                    return await new Promise(
                        (resolve, reject) => {
                            const transacao =
                                estado.banco.transaction(
                                    NOME_TABELA,
                                    "readonly"
                                );

                            const tabela =
                                transacao.objectStore(
                                    NOME_TABELA
                                );

                            const indice =
                                tabela.index(
                                    NOME_INDICE
                                );

                            const limiteSuperior =
                                antesDe === null
                                    ? "\uffff"
                                    : antesDe;

                            const intervalo =
                                IDBKeyRange.bound(
                                    [sala, ""],
                                    [
                                        sala,
                                        limiteSuperior
                                    ],
                                    false,
                                    antesDe !== null
                                );

                            const requisicao =
                                indice.openCursor(
                                    intervalo,
                                    "prev"
                                );

                            const resultado = [];

                            requisicao.onsuccess = () => {
                                const cursor =
                                    requisicao.result;

                                if (
                                    !cursor ||
                                    resultado.length >= limite
                                ) {
                                    resolve(
                                        resultado.reverse()
                                    );

                                    return;
                                }

                                resultado.push(
                                    cursor.value
                                );

                                cursor.continue();
                            };

                            requisicao.onerror = () => {
                                reject(
                                    requisicao.error
                                );
                            };
                        }
                    );
                } catch (erro) {
                    console.error(
                        "Erro ao buscar mensagens.",
                        erro
                    );

                    return buscarNaMemoria(
                        sala,
                        limite,
                        antesDe
                    );
                }
            }

            /*
             * Mensagens
             */

            function normalizarMensagem(dados) {
                if (
                    !dados ||
                    typeof dados !== "object"
                ) {
                    return null;
                }

                if (
                    !["adulto", "crianca"].includes(
                        dados.perfil
                    )
                ) {
                    return null;
                }

                const texto = String(
                    dados.texto || ""
                )
                    .trim()
                    .slice(0, 250);

                if (!texto) {
                    return null;
                }

                const id = String(
                    dados.id || gerarIdMensagem()
                ).slice(0, 120);

                const criadoEm =
                    Number(dados.criadoEm) ||
                    Date.now();

                return {
                    id,
                    sala: estado.codigoSala,
                    perfil: dados.perfil,
                    nome: String(
                        dados.nome || "Pessoa"
                    ).slice(0, 25),
                    texto,
                    criadoEm,
                    ordem:
                        dados.ordem ||
                        criarOrdem(criadoEm, id)
                };
            }

            async function migrarHistoricoAntigo() {
                const codigo =
                    limparCodigo(estado.codigoSala);

                if (
                    !codigo ||
                    salasMigradas.has(codigo) ||
                    !estado.banco
                ) {
                    return;
                }

                salasMigradas.add(codigo);

                const chaveAntiga =
                    `cantinho-historico-${codigo}`;

                const dadosAntigos =
                    localStorage.getItem(chaveAntiga);

                if (!dadosAntigos) {
                    return;
                }

                try {
                    const lista =
                        JSON.parse(dadosAntigos);

                    if (!Array.isArray(lista)) {
                        localStorage.removeItem(
                            chaveAntiga
                        );

                        return;
                    }

                    const mensagens = lista
                        .map(normalizarMensagem)
                        .filter(Boolean);

                    await salvarMensagens(mensagens);

                    localStorage.removeItem(
                        chaveAntiga
                    );
                } catch (erro) {
                    console.warn(
                        "O histórico antigo estava corrompido.",
                        erro
                    );

                    localStorage.removeItem(
                        chaveAntiga
                    );
                }
            }

            function criarBalao(mensagem) {
                const caixa =
                    document.createElement("article");

                const autor =
                    document.createElement("strong");

                const texto =
                    document.createElement("div");

                const horario =
                    document.createElement("time");

                caixa.className =
                    mensagem.perfil === estado.perfil
                        ? "mensagem minha"
                        : "mensagem outra";

                caixa.dataset.id = mensagem.id;
                caixa.dataset.ordem = mensagem.ordem;

                autor.textContent =
                    mensagem.perfil === "adulto"
                        ? `🦁 ${mensagem.nome}`
                        : `🦄 ${mensagem.nome}`;

                texto.className = "texto";
                texto.textContent = mensagem.texto;

                horario.textContent =
                    new Date(
                        mensagem.criadoEm
                    ).toLocaleTimeString(
                        "pt-BR",
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    );

                caixa.append(
                    autor,
                    texto,
                    horario
                );

                return caixa;
            }

            function mostrarAvisoSemMensagens() {
                if (
                    listaMensagens.querySelector(
                        ".mensagem"
                    )
                ) {
                    return;
                }

                if (
                    elemento("aviso-sem-mensagens")
                ) {
                    return;
                }

                const aviso =
                    document.createElement("div");

                aviso.id = "aviso-sem-mensagens";
                aviso.className = "aviso";

                aviso.textContent =
                    "⭐ Vocês estão juntinhos! Envie uma mensagem. ⭐";

                listaMensagens.appendChild(aviso);
            }

            function removerAvisoSemMensagens() {
                elemento(
                    "aviso-sem-mensagens"
                )?.remove();
            }

            function rolarAteFinal() {
                mensagensElemento.scrollTop =
                    mensagensElemento.scrollHeight;
            }

            function estaPertoDoFinal() {
                return (
                    mensagensElemento.scrollHeight -
                    mensagensElemento.scrollTop -
                    mensagensElemento.clientHeight <
                    100
                );
            }

            function limitarMensagensNaTela() {
                const elementos =
                    listaMensagens.querySelectorAll(
                        ".mensagem"
                    );

                if (
                    elementos.length <=
                    MAXIMO_NA_TELA
                ) {
                    return;
                }

                const quantidadeRemover =
                    elementos.length -
                    MAXIMO_NA_TELA;

                for (
                    let indice = 0;
                    indice < quantidadeRemover;
                    indice += 1
                ) {
                    const mensagem = elementos[indice];

                    mensagensRenderizadas.delete(
                        mensagem.dataset.id
                    );

                    mensagem.remove();
                }

                const primeira =
                    listaMensagens.querySelector(
                        ".mensagem"
                    );

                estado.primeiraOrdem =
                    primeira?.dataset.ordem || null;

                botaoMaisAntigas.classList.remove(
                    "escondido"
                );
            }

            function adicionarMensagemNaTela(
                mensagem,
                forcarRolagem = true
            ) {
                if (
                    mensagensRenderizadas.has(
                        mensagem.id
                    )
                ) {
                    return;
                }

                const estavaNoFinal =
                    estaPertoDoFinal();

                removerAvisoSemMensagens();

                listaMensagens.appendChild(
                    criarBalao(mensagem)
                );

                mensagensRenderizadas.add(
                    mensagem.id
                );

                limitarMensagensNaTela();

                if (
                    forcarRolagem ||
                    estavaNoFinal
                ) {
                    requestAnimationFrame(
                        rolarAteFinal
                    );
                }
            }

            async function carregarPaginaInicial(
                rolar = true
            ) {
                const mensagens =
                    await buscarMensagens(
                        estado.codigoSala,
                        TAMANHO_PAGINA
                    );

                listaMensagens.innerHTML = "";
                mensagensRenderizadas.clear();

                mensagens.forEach((mensagem) => {
                    mensagensMemoria.set(
                        mensagem.id,
                        mensagem
                    );

                    listaMensagens.appendChild(
                        criarBalao(mensagem)
                    );

                    mensagensRenderizadas.add(
                        mensagem.id
                    );
                });

                estado.primeiraOrdem =
                    mensagens[0]?.ordem || null;

                botaoMaisAntigas.classList.toggle(
                    "escondido",
                    mensagens.length <
                        TAMANHO_PAGINA
                );

                mostrarAvisoSemMensagens();

                if (rolar) {
                    requestAnimationFrame(
                        rolarAteFinal
                    );
                }
            }

            async function carregarMensagensAntigas() {
                if (!estado.primeiraOrdem) {
                    return;
                }

                botaoMaisAntigas.disabled = true;

                const alturaAnterior =
                    mensagensElemento.scrollHeight;

                const mensagens =
                    await buscarMensagens(
                        estado.codigoSala,
                        TAMANHO_PAGINA,
                        estado.primeiraOrdem
                    );

                if (mensagens.length === 0) {
                    botaoMaisAntigas.classList.add(
                        "escondido"
                    );

                    botaoMaisAntigas.disabled = false;

                    return;
                }

                const fragmento =
                    document.createDocumentFragment();

                mensagens.forEach((mensagem) => {
                    if (
                        mensagensRenderizadas.has(
                            mensagem.id
                        )
                    ) {
                        return;
                    }

                    mensagensMemoria.set(
                        mensagem.id,
                        mensagem
                    );

                    fragmento.appendChild(
                        criarBalao(mensagem)
                    );

                    mensagensRenderizadas.add(
                        mensagem.id
                    );
                });

                listaMensagens.prepend(fragmento);

                estado.primeiraOrdem =
                    mensagens[0].ordem;

                if (
                    mensagens.length <
                    TAMANHO_PAGINA
                ) {
                    botaoMaisAntigas.classList.add(
                        "escondido"
                    );
                }

                requestAnimationFrame(() => {
                    const novaAltura =
                        mensagensElemento.scrollHeight;

                    mensagensElemento.scrollTop +=
                        novaAltura -
                        alturaAnterior;
                });

                botaoMaisAntigas.disabled = false;
            }

            function agendarAtualizacaoHistorico() {
                clearTimeout(
                    temporizadorAtualizacao
                );

                temporizadorAtualizacao =
                    setTimeout(() => {
                        void carregarPaginaInicial(
                            true
                        );
                    }, 350);
            }

            /*
             * Conexão
             */

            function bibliotecaDisponivel() {
                return (
                    typeof window.Peer === "function"
                );
            }

            function enviarPelaRede(dados) {
                if (
                    !estado.conexao ||
                    !estado.conexao.open
                ) {
                    return false;
                }

                try {
                    estado.conexao.send(dados);
                    return true;
                } catch (erro) {
                    console.error(
                        "Erro ao enviar dados.",
                        erro
                    );

                    return false;
                }
            }

            async function enviarHistoricoCompleto() {
                if (
                    estado.sincronizando ||
                    !estado.conexao?.open
                ) {
                    return;
                }

                estado.sincronizando = true;

                const conexaoAtual =
                    estado.conexao;

                let antesDe = null;

                try {
                    while (
                        conexaoAtual ===
                            estado.conexao &&
                        conexaoAtual.open
                    ) {
                        const pagina =
                            await buscarMensagens(
                                estado.codigoSala,
                                TAMANHO_PAGINA_REDE,
                                antesDe
                            );

                        if (pagina.length === 0) {
                            break;
                        }

                        for (
                            let inicio = 0;
                            inicio < pagina.length;
                            inicio += TAMANHO_LOTE_REDE
                        ) {
                            if (
                                conexaoAtual !==
                                    estado.conexao ||
                                !conexaoAtual.open
                            ) {
                                return;
                            }

                            conexaoAtual.send({
                                tipo: "historico",
                                mensagens: pagina.slice(
                                    inicio,
                                    inicio +
                                        TAMANHO_LOTE_REDE
                                )
                            });

                            await esperar(30);
                        }

                        antesDe =
                            pagina[0].ordem;

                        if (
                            pagina.length <
                            TAMANHO_PAGINA_REDE
                        ) {
                            break;
                        }

                        await esperar(50);
                    }
                } catch (erro) {
                    console.warn(
                        "A sincronização foi interrompida.",
                        erro
                    );
                } finally {
                    estado.sincronizando = false;
                }
            }

            async function receberDados(dados) {
                if (
                    !dados ||
                    typeof dados !== "object"
                ) {
                    return;
                }

                if (dados.tipo === "ocupado") {
                    estado.conectado = false;
                    botaoEnviar.disabled = true;

                    atualizarStatus(
                        "🔴 Este cantinho já está sendo usado por dois celulares.",
                        "#ffd4dd"
                    );

                    mostrarReconectar(false);
                    estado.conexao?.close();

                    return;
                }

                if (
                    dados.tipo === "apresentacao"
                ) {
                    estado.nomeCompanheiro =
                        String(
                            dados.nome || "Pessoa"
                        ).slice(0, 25);

                    companheiro.textContent =
                        `💞 Conversando com ${estado.nomeCompanheiro}`;

                    return;
                }

                if (dados.tipo === "mensagem") {
                    const mensagem =
                        normalizarMensagem(
                            dados.mensagem
                        );

                    if (!mensagem) {
                        return;
                    }

                    const jaExistia =
                        mensagensMemoria.has(
                            mensagem.id
                        );

                    await salvarMensagens([
                        mensagem
                    ]);

                    adicionarMensagemNaTela(
                        mensagem,
                        true
                    );

                    if (!jaExistia) {
                        void tocarSomRecebimento();
                    }

                    return;
                }

                if (
                    dados.tipo === "historico" &&
                    Array.isArray(dados.mensagens)
                ) {
                    const mensagens =
                        dados.mensagens
                            .map(normalizarMensagem)
                            .filter(Boolean);

                    await salvarMensagens(
                        mensagens
                    );

                    agendarAtualizacaoHistorico();
                }
            }

            async function quandoConectar(
                token,
                conexaoAtual
            ) {
                if (
                    token !== estado.geracao ||
                    conexaoAtual !==
                        estado.conexao
                ) {
                    return;
                }

                estado.conectado = true;

                atualizarStatus(
                    "🟢 Os dois celulares estão conectados!",
                    "#c9f5d6"
                );

                mostrarReconectar(false);
                botaoEnviar.disabled = false;

                await garantirArmazenamento();
                await migrarHistoricoAntigo();
                await carregarPaginaInicial(true);

                mostrarTela("chat");

                codigoMini.textContent =
                    estado.perfil === "adulto"
                        ? `Código: ${formatarCodigo(
                            estado.codigoSala
                        )}`
                        : "Conversa particular";

                enviarPelaRede({
                    tipo: "apresentacao",
                    nome: estado.meuNome,
                    perfil: estado.perfil
                });

                void enviarHistoricoCompleto();

                campoTexto.focus();
            }

            function configurarConexao(
                novaConexao,
                token
            ) {
                estado.conexao = novaConexao;
                estado.conectado = false;

                novaConexao.on("open", () => {
                    void quandoConectar(
                        token,
                        novaConexao
                    );
                });

                novaConexao.on("data", (dados) => {
                    if (
                        token === estado.geracao
                    ) {
                        void receberDados(dados);
                    }
                });

                novaConexao.on("error", (erro) => {
                    if (
                        token !== estado.geracao
                    ) {
                        return;
                    }

                    console.error(
                        "Erro na conexão.",
                        erro
                    );

                    atualizarStatus(
                        "🔴 A conexão entre os celulares falhou.",
                        "#ffd4dd"
                    );
                });

                novaConexao.on("close", () => {
                    if (
                        token !== estado.geracao ||
                        estado.conexao !==
                            novaConexao
                    ) {
                        return;
                    }

                    estado.conexao = null;
                    estado.conectado = false;
                    estado.sincronizando = false;

                    botaoEnviar.disabled = true;

                    if (
                        estado.perfil === "adulto"
                    ) {
                        atualizarStatus(
                            "🟡 Aguardando o celular da criança entrar novamente…",
                            "#fff1a6"
                        );

                        mostrarReconectar(false);
                    } else {
                        atualizarStatus(
                            "🟡 A conexão caiu. Toque em Reconectar.",
                            "#fff1a6"
                        );

                        mostrarReconectar(true);
                    }
                });
            }

            function recusarTerceiraConexao(
                novaConexao
            ) {
                novaConexao.on("open", () => {
                    try {
                        novaConexao.send({
                            tipo: "ocupado"
                        });
                    } finally {
                        setTimeout(() => {
                            novaConexao.close();
                        }, 300);
                    }
                });
            }

            function configurarEventosDoPeer(
                peerAtual,
                token
            ) {
                peerAtual.on("error", (erro) => {
                    if (
                        token !== estado.geracao
                    ) {
                        return;
                    }

                    console.error(
                        "Erro do PeerJS.",
                        erro
                    );

                    const mensagensErro = {
                        "peer-unavailable":
                            "Código não encontrado. Confira o código no celular do adulto.",

                        "unavailable-id":
                            "Este código já está aberto em outra aba. Feche a outra aba ou gere um novo código.",

                        "network":
                            "Falha de internet. Confira a conexão dos celulares.",

                        "server-error":
                            "O serviço de conexão está temporariamente indisponível.",

                        "socket-error":
                            "Não foi possível acessar o serviço de conexão.",

                        "browser-incompatible":
                            "Este navegador não é compatível com o aplicativo."
                    };

                    atualizarStatus(
                        "🔴 " +
                        (
                            mensagensErro[erro.type] ||
                            "Não foi possível conectar."
                        ),
                        "#ffd4dd"
                    );

                    if (
                        estado.perfil === "crianca"
                    ) {
                        mostrarReconectar(true);
                    }
                });

                peerAtual.on("disconnected", () => {
                    if (
                        token !== estado.geracao
                    ) {
                        return;
                    }

                    atualizarStatus(
                        "🟡 Tentando recuperar a conexão…",
                        "#fff1a6"
                    );

                    setTimeout(() => {
                        if (
                            token !== estado.geracao ||
                            estado.peer !== peerAtual
                        ) {
                            return;
                        }

                        try {
                            peerAtual.reconnect();
                        } catch (erro) {
                            console.warn(
                                "Reconexão não realizada.",
                                erro
                            );
                        }
                    }, 1200);
                });
            }

            function encerrarRede() {
                estado.geracao += 1;

                const conexaoAnterior =
                    estado.conexao;

                const peerAnterior =
                    estado.peer;

                estado.conexao = null;
                estado.peer = null;
                estado.conectado = false;
                estado.sincronizando = false;

                botaoEnviar.disabled = true;

                try {
                    conexaoAnterior?.close();
                } catch (erro) {
                    console.warn(erro);
                }

                try {
                    peerAnterior?.destroy();
                } catch (erro) {
                    console.warn(erro);
                }

                return estado.geracao;
            }

            async function prepararAplicativo() {
                prepararAudio();

                if (!bibliotecaDisponivel()) {
                    throw new Error(
                        "A biblioteca PeerJS não foi carregada."
                    );
                }

                await garantirArmazenamento();
            }

            async function criarSalaAdulto(
                forcarNovoCodigo = false
            ) {
                const botao =
                    elemento("criar-sala");

                botao.disabled = true;

                const token = encerrarRede();

                try {
                    atualizarStatus(
                        "🟡 Preparando o aplicativo…"
                    );

                    await prepararAplicativo();

                    estado.perfil = "adulto";

                    estado.meuNome =
                        elemento(
                            "nome-adulto"
                        ).value.trim() ||
                        "Papai ou Mamãe";

                    localStorage.setItem(
                        CHAVE_NOME_ADULTO,
                        estado.meuNome
                    );

                    let codigo =
                        localStorage.getItem(
                            CHAVE_CODIGO_ADULTO
                        );

                    if (
                        forcarNovoCodigo ||
                        limparCodigo(codigo).length !==
                            12
                    ) {
                        codigo = gerarCodigo();

                        localStorage.setItem(
                            CHAVE_CODIGO_ADULTO,
                            codigo
                        );
                    }

                    estado.codigoSala =
                        limparCodigo(codigo);

                    elemento(
                        "codigo-exibido"
                    ).textContent =
                        formatarCodigo(
                            estado.codigoSala
                        );

                    mostrarTela(
                        "espera-adulto"
                    );

                    estado.peer = new window.Peer(
                        idDaSala(
                            estado.codigoSala
                        ),
                        {
                            debug: 1
                        }
                    );

                    configurarEventosDoPeer(
                        estado.peer,
                        token
                    );

                    estado.peer.on("open", () => {
                        if (
                            token !== estado.geracao
                        ) {
                            return;
                        }

                        atualizarStatus(
                            "🟡 Aguardando o segundo celular…",
                            "#fff1a6"
                        );
                    });

                    estado.peer.on(
                        "connection",
                        (novaConexao) => {
                            if (
                                token !== estado.geracao
                            ) {
                                novaConexao.close();
                                return;
                            }

                            if (estado.conexao) {
                                recusarTerceiraConexao(
                                    novaConexao
                                );

                                return;
                            }

                            configurarConexao(
                                novaConexao,
                                token
                            );
                        }
                    );
                } catch (erro) {
                    console.error(erro);

                    atualizarStatus(
                        "🔴 Não foi possível iniciar. Confira a internet e recarregue a página.",
                        "#ffd4dd"
                    );
                } finally {
                    botao.disabled = false;
                }
            }

            async function entrarComoCrianca() {
                const codigo =
                    limparCodigo(
                        elemento(
                            "codigo-crianca"
                        ).value
                    );

                if (codigo.length !== 12) {
                    atualizarStatus(
                        "🔴 Digite o código completo com 12 letras e números.",
                        "#ffd4dd"
                    );

                    return;
                }

                const botao =
                    elemento("entrar-sala");

                botao.disabled = true;

                const token = encerrarRede();

                try {
                    atualizarStatus(
                        "🟡 Preparando o aplicativo…"
                    );

                    await prepararAplicativo();

                    estado.perfil = "crianca";
                    estado.codigoSala = codigo;

                    estado.meuNome =
                        elemento(
                            "nome-crianca"
                        ).value.trim() ||
                        "Minha estrelinha";

                    localStorage.setItem(
                        CHAVE_NOME_CRIANCA,
                        estado.meuNome
                    );

                    localStorage.setItem(
                        CHAVE_ULTIMO_CODIGO,
                        estado.codigoSala
                    );

                    atualizarStatus(
                        "🟡 Procurando o celular do adulto…"
                    );

                    estado.peer =
                        new window.Peer(
                            undefined,
                            {
                                debug: 1
                            }
                        );

                    configurarEventosDoPeer(
                        estado.peer,
                        token
                    );

                    estado.peer.on("open", () => {
                        if (
                            token !== estado.geracao
                        ) {
                            return;
                        }

                        const novaConexao =
                            estado.peer.connect(
                                idDaSala(
                                    estado.codigoSala
                                ),
                                {
                                    reliable: true
                                }
                            );

                        configurarConexao(
                            novaConexao,
                            token
                        );
                    });
                } catch (erro) {
                    console.error(erro);

                    atualizarStatus(
                        "🔴 Não foi possível abrir a conexão. Confira sua internet.",
                        "#ffd4dd"
                    );

                    mostrarReconectar(true);
                } finally {
                    botao.disabled = false;
                }
            }

            async function enviarMensagem(texto) {
                const mensagemLimpa =
                    String(texto || "").trim();

                if (!mensagemLimpa) {
                    return;
                }

                if (
                    !estado.conectado ||
                    !estado.conexao?.open
                ) {
                    atualizarStatus(
                        "🟡 O outro celular ainda não está conectado.",
                        "#fff1a6"
                    );

                    return;
                }

                const id =
                    gerarIdMensagem();

                const criadoEm =
                    Date.now();

                const mensagem = {
                    id,
                    sala: estado.codigoSala,
                    perfil: estado.perfil,
                    nome: estado.meuNome,
                    texto:
                        mensagemLimpa.slice(
                            0,
                            250
                        ),
                    criadoEm,
                    ordem:
                        criarOrdem(
                            criadoEm,
                            id
                        )
                };

                await salvarMensagens([
                    mensagem
                ]);

                adicionarMensagemNaTela(
                    mensagem,
                    true
                );

                const enviado =
                    enviarPelaRede({
                        tipo: "mensagem",
                        mensagem
                    });

                if (enviado) {
                    void tocarSomEnvio();
                } else {
                    atualizarStatus(
                        "⚠️ A mensagem ficou salva neste celular, mas não foi enviada.",
                        "#ffe0a8"
                    );
                }

                campoTexto.value = "";
                campoTexto.focus();
            }

            function reiniciarAplicativo() {
                encerrarRede();

                estado.perfil = "";
                estado.meuNome = "";
                estado.nomeCompanheiro = "";
                estado.codigoSala = "";
                estado.primeiraOrdem = null;

                mensagensRenderizadas.clear();
                listaMensagens.innerHTML = "";

                botaoMaisAntigas.classList.add(
                    "escondido"
                );

                mostrarReconectar(false);
                mostrarTela("inicio");

                atualizarStatus(
                    "🟡 Escolha quem usará este celular"
                );
            }

            /*
             * Eventos
             */

            document.addEventListener(
                "pointerdown",
                prepararAudio,
                {
                    passive: true
                }
            );

            elemento(
                "escolher-adulto"
            ).addEventListener(
                "click",
                () => {
                    prepararAudio();

                    mostrarTela(
                        "config-adulto"
                    );
                }
            );

            elemento(
                "escolher-crianca"
            ).addEventListener(
                "click",
                () => {
                    prepararAudio();

                    mostrarTela(
                        "config-crianca"
                    );
                }
            );

            document
                .querySelectorAll(".voltar")
                .forEach((botao) => {
                    botao.addEventListener(
                        "click",
                        () => {
                            mostrarTela(
                                "inicio"
                            );
                        }
                    );
                });

            document
                .querySelectorAll(".reiniciar")
                .forEach((botao) => {
                    botao.addEventListener(
                        "click",
                        reiniciarAplicativo
                    );
                });

            elemento(
                "criar-sala"
            ).addEventListener(
                "click",
                () => {
                    void criarSalaAdulto(false);
                }
            );

            elemento(
                "novo-codigo"
            ).addEventListener(
                "click",
                () => {
                    void criarSalaAdulto(true);
                }
            );

            elemento(
                "entrar-sala"
            ).addEventListener(
                "click",
                () => {
                    void entrarComoCrianca();
                }
            );

            elemento(
                "reconectar"
            ).addEventListener(
                "click",
                () => {
                    void entrarComoCrianca();
                }
            );

            elemento(
                "sair"
            ).addEventListener(
                "click",
                reiniciarAplicativo
            );

            elemento(
                "codigo-crianca"
            ).addEventListener(
                "input",
                (evento) => {
                    evento.target.value =
                        formatarCodigo(
                            evento.target.value
                        );
                }
            );

            elemento(
                "copiar-codigo"
            ).addEventListener(
                "click",
                async () => {
                    const codigo =
                        formatarCodigo(
                            estado.codigoSala
                        );

                    try {
                        await navigator.clipboard
                            .writeText(codigo);

                        const botao =
                            elemento(
                                "copiar-codigo"
                            );

                        const textoAnterior =
                            botao.textContent;

                        botao.textContent =
                            "Código copiado!";

                        setTimeout(() => {
                            botao.textContent =
                                textoAnterior;
                        }, 1500);
                    } catch (erro) {
                        window.prompt(
                            "Copie o código:",
                            codigo
                        );
                    }
                }
            );

            elemento(
                "compartilhar-codigo"
            ).addEventListener(
                "click",
                async () => {
                    const texto =
                        "Entre no Nosso Cantinho com o código: " +
                        formatarCodigo(
                            estado.codigoSala
                        );

                    try {
                        if (navigator.share) {
                            await navigator.share({
                                title:
                                    "Nosso Cantinho Mágico",
                                text: texto
                            });
                        } else {
                            window.prompt(
                                "Compartilhe esta mensagem:",
                                texto
                            );
                        }
                    } catch (erro) {
                        /*
                         * O usuário pode cancelar o compartilhamento.
                         */
                    }
                }
            );

            elemento(
                "formulario"
            ).addEventListener(
                "submit",
                (evento) => {
                    evento.preventDefault();

                    void enviarMensagem(
                        campoTexto.value
                    );
                }
            );

            elemento(
                "emojis"
            ).addEventListener(
                "click",
                (evento) => {
                    const botao =
                        evento.target.closest(
                            "button"
                        );

                    if (botao) {
                        void enviarMensagem(
                            botao.textContent
                        );
                    }
                }
            );

            botaoMaisAntigas.addEventListener(
                "click",
                () => {
                    void carregarMensagensAntigas();
                }
            );

            botaoSom.addEventListener(
                "click",
                () => {
                    somAtivado = !somAtivado;

                    localStorage.setItem(
                        CHAVE_SOM,
                        String(somAtivado)
                    );

                    atualizarBotaoSom();

                    if (somAtivado) {
                        void tocarSomEnvio();
                    }
                }
            );

            window.addEventListener(
                "beforeunload",
                () => {
                    try {
                        estado.conexao?.close();
                        estado.peer?.destroy();
                    } catch (erro) {
                        console.warn(erro);
                    }
                }
            );

            /*
             * Inicialização
             */

            elemento("nome-adulto").value =
                localStorage.getItem(
                    CHAVE_NOME_ADULTO
                ) ||
                "Papai ou Mamãe";

            elemento("nome-crianca").value =
                localStorage.getItem(
                    CHAVE_NOME_CRIANCA
                ) ||
                "Minha estrelinha";

            elemento("codigo-crianca").value =
                formatarCodigo(
                    localStorage.getItem(
                        CHAVE_ULTIMO_CODIGO
                    ) || ""
                );

            atualizarBotaoSom();

            void iniciarArmazenamento();
        });
    </script>
</body>
</html>
